<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>목표를 골라주세요 - 힐링 저축 플래너</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Gaegu & Nunito for cozy game feeling -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'cream-bg': '#FAF6EC',
            'cocoa': '#5C4A3A',
            'cocoa-light': '#8A7563',
            'sage-green': '#8FB98A',
            'sage-dark': '#729E6E',
            'sage-light': '#F0F6EE',
            'card-border': '#D6C9B0',
            'warm-peach': '#F5DDC4',
          },
          fontFamily: {
            'game': ['Jua', 'Nunito', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Game-like Styles -->
<style data-purpose="game-ui-styling">
    body {
      background-color: #ECE5D5;
      font-family: 'Jua', 'Nunito', sans-serif;
      color: #5C4A3A;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Subtle pasture/grass dots background pattern */
    .pasture-bg {
      background-color: #FAF6EC;
      background-image: radial-gradient(#E8DEC8 2px, transparent 2px);
      background-size: 24px 24px;
    }

    /* Chunky physical tactile button effect */
    .tactile-card {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 0 #C4B69E;
    }

    .tactile-card:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #C4B69E;
    }

    .tactile-card-selected {
      box-shadow: 0 4px 0 #729E6E;
    }

    .tactile-card-selected:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #729E6E;
    }

    /* Bottom game action button */
    .game-action-btn {
      transition: all 0.12s ease-in-out;
      box-shadow: 0 5px 0 #6A9666;
    }

    .game-action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #6A9666;
    }

    /* Soft floating leaf animation */
    @keyframes gentleWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }
    .wiggle-hover:hover {
      animation: gentleWiggle 0.6s ease-in-out infinite;
    }
  </style>
<!-- END: Custom Game-like Styles -->
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: MobileFrameContainer -->
<!-- iPhone mobile viewport mock (w-full max-w-[420px]) -->
<div class="pasture-bg w-full max-w-[420px] min-h-screen sm:min-h-[844px] sm:h-[844px] sm:rounded-[42px] sm:border-[10px] sm:border-[#EDE5D3] sm:shadow-2xl flex flex-col justify-between p-6 sm:px-7 sm:py-8 relative overflow-hidden">
<!-- Decorative cute leaf watermark in corner -->
<div class="absolute -top-6 -right-6 w-24 h-24 bg-sage-light rounded-full opacity-60 pointer-events-none"></div>
<!-- BEGIN: TopHeaderSection -->
<header class="pt-4 z-10">
<!-- Top Step & Subtitle Badge -->
<div class="inline-flex items-center gap-2 bg-[#EFE6D2] px-3.5 py-1.5 rounded-full mb-3 text-xs tracking-wide text-cocoa font-bold border border-[#E0D5BE]">
<!-- Sprout Icon -->
<svg class="w-4 h-4 text-sage-dark animate-bounce" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C8.5 2 5.5 4.5 5 8c-.5 3.5 1.5 6.5 5 8v4c0 .55.45 1 1 1s1-.45 1-1v-5c0-.55-.45-1-1-1-2.5 0-4-2-3.8-4.3C7.4 8.2 9.5 6 12 6s4.6 2.2 4.8 4.7c.2 2.3-1.3 4.3-3.8 4.3-.55 0-1 .45-1 1v5c0 .55.45 1 1 1s1-.45 1-1v-4c3.5-1.5 5.5-4.5 5-8-.5-3.5-3.5-6-7-6z"></path>
</svg>
<span>자금 마련 퀘스트 · STEP 1</span>
</div>
<!-- Main Title (① 목표를 골라주세요) -->
<div class="flex items-center gap-3">
<!-- Number Icon Badge -->
<span class="flex items-center justify-center w-8 h-8 rounded-full bg-cocoa text-cream-bg text-base shadow-sm">
          1
        </span>
<h1 class="text-2xl sm:text-[26px] tracking-tight font-black text-cocoa">
          목표를 골라주세요
        </h1>
<!-- Small Acorn Decoration -->
<span class="text-xl wiggle-hover inline-block cursor-default" title="도토리">🌰</span>
</div>
<p class="text-cocoa-light text-sm mt-1.5 ml-11 font-medium">
        어떤 설레는 꿈을 향해 모아볼까요?
      </p>
</header>
<!-- END: TopHeaderSection -->
<!-- BEGIN: GoalOptionsList -->
<!-- Preserving the exact 4 options from Image 3: 1억 모으기, 내집마련, 여행 자금, 기타 -->
<main class="my-auto py-6 space-y-4 z-10" data-purpose="goal-selection-group">
<!-- Option 1: 1억 모으기 (Active/Selected State) -->
<button class="tactile-card-selected w-full bg-sage-light border-[2.5px] border-sage-green rounded-[22px] p-4 flex items-center justify-between text-left group" data-purpose="goal-option" type="button">
<div class="flex items-center gap-3.5">
<!-- Sparkling Coin/Bell Bag Icon Container -->
<div class="w-12 h-12 rounded-2xl bg-sage-green/20 flex items-center justify-center text-2xl shadow-inner group-hover:scale-110 transition-transform">
            💰
          </div>
<div>
<span class="text-[19px] font-bold text-cocoa block">1억 모으기</span>
<span class="text-xs text-sage-dark font-medium">든든한 목돈의 첫 시작!</span>
</div>
</div>
<!-- Selected Checkmark Bubble -->
<div class="w-7 h-7 rounded-full bg-sage-green flex items-center justify-center shadow-sm">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
<!-- Option 2: 내집마련 -->
<button class="tactile-card w-full bg-white border-[2.5px] border-card-border rounded-[22px] p-4 flex items-center justify-between text-left hover:border-[#BFB197] group" data-purpose="goal-option" type="button">
<div class="flex items-center gap-3.5">
<!-- House Icon Container -->
<div class="w-12 h-12 rounded-2xl bg-[#F6F0E4] flex items-center justify-center text-2xl shadow-inner group-hover:scale-110 transition-transform">
            🏡
          </div>
<div>
<span class="text-[19px] font-bold text-cocoa block">내집마련</span>
<span class="text-xs text-cocoa-light font-medium">따뜻하고 아늑한 나만의 보금자리</span>
</div>
</div>
<!-- Unselected Indicator Ring -->
<div class="w-6 h-6 rounded-full border-2 border-card-border bg-[#FAF7F0]"></div>
</button>
<!-- Option 3: 여행 자금 -->
<button class="tactile-card w-full bg-white border-[2.5px] border-card-border rounded-[22px] p-4 flex items-center justify-between text-left hover:border-[#BFB197] group" data-purpose="goal-option" type="button">
<div class="flex items-center gap-3.5">
<!-- Travel/Airplane Icon Container -->
<div class="w-12 h-12 rounded-2xl bg-[#EAF2F6] flex items-center justify-center text-2xl shadow-inner group-hover:scale-110 transition-transform">
            ✈️
          </div>
<div>
<span class="text-[19px] font-bold text-cocoa block">여행 자금</span>
<span class="text-xs text-cocoa-light font-medium">새로운 섬으로 떠나는 두근두근 힐링</span>
</div>
</div>
<!-- Unselected Indicator Ring -->
<div class="w-6 h-6 rounded-full border-2 border-card-border bg-[#FAF7F0]"></div>
</button>
<!-- Option 4: 기타 -->
<button class="tactile-card w-full bg-white border-[2.5px] border-card-border rounded-[22px] p-4 flex items-center justify-between text-left hover:border-[#BFB197] group" data-purpose="goal-option" type="button">
<div class="flex items-center gap-3.5">
<!-- Gift / Note Icon Container -->
<div class="w-12 h-12 rounded-2xl bg-[#FDF0EE] flex items-center justify-center text-2xl shadow-inner group-hover:scale-110 transition-transform">
            🎁
          </div>
<div>
<span class="text-[19px] font-bold text-cocoa block">기타</span>
<span class="text-xs text-cocoa-light font-medium">나만의 특별한 버킷리스트</span>
</div>
</div>
<!-- Unselected Indicator Ring -->
<div class="w-6 h-6 rounded-full border-2 border-card-border bg-[#FAF7F0]"></div>
</button>
</main>
<!-- END: GoalOptionsList -->
<!-- BEGIN: FooterActionSection -->
<footer class="pb-2 pt-2 z-10">
<!-- Primary Pill Game Action Button -->
<button class="game-action-btn w-full py-4 rounded-full bg-sage-green text-white text-xl font-black tracking-wide border-2 border-[#7EAA78] flex items-center justify-center gap-2" data-purpose="submit-selection" id="next-step-btn" type="button">
<span>다음</span>
<svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="3" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Bottom iOS Home Indicator safe area spacing for mobile realism -->
<div class="w-32 h-1.5 bg-[#DFD6C2] rounded-full mx-auto mt-5 opacity-70"></div>
</footer>
<!-- END: FooterActionSection -->
</div>
<!-- END: MobileFrameContainer -->
</body></html>
