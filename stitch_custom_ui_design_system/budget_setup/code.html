<!-- Interactive Input Formatting Script -->
<script data-purpose="budget-input-formatter">
    const budgetInput = document.getElementById('monthly-budget-input');
    const nextBtn = document.getElementById('next-button');

    // Auto-format Korean Won numbers with comma separators
    budgetInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      if (val) {
        e.target.value = Number(val).toLocaleString('ko-KR');
      } else {
        e.target.value = '';
      }
    });

    // Gentle tactile feedback upon button click
    nextBtn.addEventListener('click', () => {
      const budgetVal = budgetInput.value.trim();
      if (!budgetVal) {
        budgetInput.focus();
        // Shake animation effect for cute interaction
        budgetInput.parentElement.parentElement.classList.add('animate-bounce');
        setTimeout(() => {
          budgetInput.parentElement.parentElement.classList.remove('animate-bounce');
        }, 500);
      } else {
        // Ready for next flow
        console.log("Budget confirmed:", budgetVal);
      }
    });
  </script>
